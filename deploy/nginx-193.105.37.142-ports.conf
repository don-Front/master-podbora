# Фрагмент для nginx на 193.105.37.142 — проброс на dev-хост с master-podbora.
# Подключить в http {} или include из sites-enabled, затем: nginx -t && systemctl reload nginx
#
# React:  http://193.105.37.142:10111  -> 192.168.5.53:10111
# Django: http://193.105.37.142:10112  -> 192.168.5.53:10112

upstream master_podbora_react {
    server 192.168.5.53:10111;
}

upstream master_podbora_django {
    server 192.168.5.53:10112;
}

server {
    listen 10111;
    server_name 193.105.37.142;

    location / {
        proxy_pass http://master_podbora_react;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}

server {
    listen 10112;
    server_name 193.105.37.142;

    location / {
        proxy_pass http://master_podbora_django;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 120s;
    }
}
