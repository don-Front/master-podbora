# Прокси чата master-podbora через HTTPS сайта turbo-podbor.ru (для WordPress и виджета).
# На сервере с nginx + Let's Encrypt: include в server { listen 443 ssl; server_name turbo-podbor.ru; }
#
# Бэкенд на ПК через DNAT (с VPS turbo-podbor.ru доступен 193.105.37.142:10111 / :10112).
# После смены URL пересоберите dist: REACT_APP_API_URL=https://turbo-podbor.ru/podbor-api/api
#   и homepage=/podbor-chat/ (см. front/chatbot/.env.production.proxy-example)

upstream master_podbora_react {
    server 193.105.37.142:10111;
    keepalive 8;
}

upstream master_podbora_django {
    server 193.105.37.142:10112;
    keepalive 8;
}

# --- UI: https://turbo-podbor.ru/podbor-chat/  (статика dist или proxy на :10111) ---

location /podbor-chat/ {
    proxy_hide_header X-Frame-Options;
    proxy_hide_header Content-Security-Policy;
    add_header Content-Security-Policy "frame-ancestors 'self' https://turbo-don.ru https://www.turbo-don.ru https://*.turbo-don.ru" always;
    proxy_pass http://master_podbora_react/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
}

# --- API: https://turbo-podbor.ru/podbor-api/  -> Django ---

location /podbor-api/ {
    proxy_pass http://master_podbora_django/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_read_timeout 120s;
    client_max_body_size 100M;
}

