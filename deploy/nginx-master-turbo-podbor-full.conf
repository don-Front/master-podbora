# master-turbo-podbor.ru — FastAPI + chatbot proxy
# FastAPI: 127.0.0.1:8080 | React: 193.105.37.142:10111 | Django: 193.105.37.142:10112

upstream master_podbora_fastapi {
    server 127.0.0.1:8080;
    keepalive 8;
}

upstream master_podbora_react {
    server 193.105.37.142:10111;
    keepalive 8;
}

upstream master_podbora_django {
    server 193.105.37.142:10112;
    keepalive 8;
}

server {
    listen 80;
    listen [::]:80;
    server_name master-turbo-podbor.ru www.master-turbo-podbor.ru;

    client_max_body_size 100M;

    # UI: http://master-turbo-podbor.ru/podbor-chat/
    location /podbor-chat/ {
        proxy_hide_header X-Frame-Options;
        proxy_hide_header Content-Security-Policy;
        add_header Content-Security-Policy "frame-ancestors 'self' https://turbo-don.ru https://www.turbo-don.ru https://*.turbo-don.ru" always;
        proxy_pass http://master_podbora_react/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # API: http://master-turbo-podbor.ru/podbor-api/ -> Django
    location /podbor-api/ {
        proxy_pass http://master_podbora_django/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 120s;
    }

    # FastAPI (подбор, цены, ТКП)
    location / {
        proxy_pass http://master_podbora_fastapi;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}
