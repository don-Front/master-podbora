# /etc/nginx/conf.d/chatbot-widget.conf
#
# Replace placeholders before enabling:
# - api.твой-домен.ru
# - /путь/к/front/chatbot/build/dist
# - SSL certificate paths
# - FastAPI/Django ports if they differ on your server

upstream fastapi_backend {
    server 127.0.0.1:8000;
    keepalive 32;
}

upstream django_backend {
    # Daphne/Django backend. Remove this upstream and /django/ location if unused.
    server 127.0.0.1:8002;
    keepalive 16;
}

map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

server {
    listen 80;
    listen [::]:80;
    server_name api.твой-домен.ru;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name api.твой-домен.ru;

    root /путь/к/front/chatbot/build/dist;
    index index.html;

    ssl_certificate /etc/letsencrypt/live/api.твой-домен.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.твой-домен.ru/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets off;

    client_max_body_size 25m;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # Widget loader: https://api.твой-домен.ru/widget.js
    location = /widget.js {
        try_files /widget.js =404;
        add_header Cache-Control "public, max-age=300" always;
    }

    # React iframe entry point: https://api.твой-домен.ru/index.html
    location = /index.html {
        try_files /index.html =404;
        add_header Cache-Control "no-cache" always;
    }

    # CRA static assets.
    location /static/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    # Equipment/public assets copied by CRA from public/.
    location /equipment/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=86400" always;
    }

    # Fallback for the React app inside iframe.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # FastAPI. This preserves the /api/ prefix.
    # If your FastAPI routes are WITHOUT /api prefix, change proxy_pass to:
    # proxy_pass http://fastapi_backend/;
    location /api/ {
        proxy_pass http://fastapi_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_connect_timeout 60s;
    }

    # Optional Django/Daphne backend under /django/.
    # This strips /django/ before forwarding. Example:
    # /django/api/hints/ -> Django receives /api/hints/
    location /django/ {
        proxy_pass http://django_backend/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_connect_timeout 60s;
    }
}
