# Сравнение Turbo Flow UFG с конкурентами
# Источники: «Преимущества UFG перед конкурентами.docx»,
# «СРАВНИТЕЛЬНАЯ преимущества.xlsx», обзор ЭМИС, техсовет 2026.

turbo_product:
  brand: 'НПО «Турбулентность-Дон»'
  product_name: 'Turbo Flow UFG-F / UFG-H / UFG-Z'
  image_key: turbo_flow_ufg-f-c.png
  title: 'Расходомеры-счётчики Turbo Flow UFG'
  highlights:
    - 'DN 15–1400 (UFG-F), до DN 5000 (UFG-Z)'
    - 'Расход от 0,016 м³/ч (UFG-H) / 0,025 м³/ч (UFG-F)'
    - 'Давление до 55 МПа (UFG-F), до 32 МПа (UFG-Z)'
    - 'Эксплуатация −70…+80 °C, спец. до +150 °C'
    - 'Среда −60…+280 °C, спец. до −196 °C'
    - 'Срок службы 25 лет, МПИ UFG-H — 6 лет, IP66/IP67'
    - 'Реверсивное исполнение, автономия до 5 лет'
    - 'Динамический диапазон до 1:2600'

comparisons:
  irvis_ultra:
    competitor_short: 'ИРВИС-Ультра'
    rows:
      - label: 'Диаметры, DN'
        turbo: '15–1400 / до 5000 (Z)'
        competitor: '50–4000'
      - label: 'Расход, м³/ч'
        turbo: 'от 0,025 до 150 000'
        competitor: 'от 0,12 до 16 000'
      - label: 'Давление'
        turbo: 'до 55 МПа (UFG-F)'
        competitor: 'до 16 МПа'
      - label: 'Температура эксплуатации'
        turbo: '−70…+80 °C, спец. +150 °C'
        competitor: '−40…+60 °C / блок −10…+45 °C'
      - label: 'Срок службы / МПИ'
        turbo: '25 лет / МПИ 6 лет (UFG-H)'
        competitor: '15 лет / МПИ 4 года'

  ktm_600:
