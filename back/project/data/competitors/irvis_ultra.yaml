id: irvis_ultra
competitor: "ООО НПП «Ирвис»"
product_name: "Расходомер-счётчик ультразвуковой ИРВИС-Ультра (полнопроходной Пп)"
source_document: "РЭ ИРВИС-Ультра.pdf"
source_section: "п. 3.1, структура обозначения"
document_code: "ИРВС 9100.0000.00 РЭ7"
