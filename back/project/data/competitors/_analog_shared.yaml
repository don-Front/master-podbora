# Общие таблицы и дефолты для подбора аналогов Turbo-Don через /api/search-equipment

default_gas_specs:
  medium: gas
  gas_type: "природный газ"
  flowMin: 0
  flow_unit: "м³/ч"
  pressureMin: 0.1
  pressure_unit: "МПа"
  tempMediumMin: -10
  tempMediumMax: 50
  tempAmbientMin: -40
  tempAmbientMax: 50
  temperature_unit: "°C"
  accuracy: "1"

# Qmax (м³/ч) по типоразмеру G — РСГ/РГ-Т/ULTRAMAG (из РЭ)
g_size_qmax:
  G6: 10
  G10: 16
  G16: 25
  G25: 40
  G40: 65
  G65: 100
  G100: 160
  G160: 250
  G250: 400
  G400: 650
  G650: 1000
  G1000: 1600
  G1600: 2500
  G2500: 4000
  G4000: 6500

# PN → МПа
pn_mpa:
  PN10: 1.0
  PN16: 1.6
  PN25: 2.5
  PN40: 4.0
  PN100: 10.0
  PN0016: 1.6
  PN0025: 2.5
  PN0040: 4.0
  PN0063: 6.3
  PN0100: 10.0
  PN0160: 16.0
  PN0250: 25.0
  PN0400: 40.0
  PN0450: 45.0

# ИРВИС qmax: G25 = 25 м³/ч
irvis_qmax:
  G25: 25
  "100": 100
  "270": 270

# ИРВИС точность
irvis_accuracy:
  ГОТ: "1"
  GOT: "1"
  ГПТ: "0.5"
  GPT: "0.5"

# РСГ вариант погрешности → %
rsg_accuracy_variant:
  "1": "0.5"
  "2": "1"
  "3": "1.5"

# РГ-Т метрология
rg_t_metrology:
  "О": "1"
  O: "1"
  "2У": "0.5"
  "2Y": "0.5"

# Вымпел давление (И/А + число × 0.1 МПа)
vympel_pressure_factor: 0.1

# ЭЛМЕТРО-Фломак: код давления → МПа
elmetro_flomak_pressure_mpa:
  L: 4.0
  N: 6.3
  M: 10.0
  E: 16.0
  H: 25.0
  R: 32.0
  S: 40.0
  T: 50.0

# ЭЛМЕТРО-Флоус (ДРУ): код давления → МПа
elmetro_flous_pressure_mpa:
  B: 2.5
  L: 4.0
  S: 6.3
  M: 10.0
  E: 16.0
  H: 25.0

# ЭЛМЕТРО-Флоус (ДРУ): класс точности → %
elmetro_flous_accuracy:
  A: "0.5"
  B: "0.7"
  C: "1.0"
  D: "1.5"
  F: "3.0"

# ЭЛМЕТРО-Фломак: класс точности → %
elmetro_flomak_accuracy:
  E: "0.1"
  W: "0.15"
  A: "0.2"
  C: "0.5"

# КТМ РуМАСС: код погрешности → %
ktm_rumass_accuracy:
  "10": "0.1"
  "11": "0.11"
  "15": "0.15"
