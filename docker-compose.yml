services:
  chatbot-backend:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
    container_name: master-podbora-backend
    restart: unless-stopped
    environment:
      DJANGO_DEBUG: "0"
      DJANGO_ALLOWED_HOSTS: "localhost,127.0.0.1,193.105.37.142,192.168.5.53,master-turbo-podbor.ru,www.master-turbo-podbor.ru"
      DJANGO_CORS_ALLOWED_ORIGINS: "http://master-turbo-podbor.ru,https://master-turbo-podbor.ru,http://193.105.37.142:10111,http://193.105.37.142:10112,http://192.168.5.53:10111,http://192.168.5.53:10112"
      DJANGO_CSRF_TRUSTED_ORIGINS: "http://master-turbo-podbor.ru,https://master-turbo-podbor.ru,http://193.105.37.142:10111,http://193.105.37.142:10112,http://192.168.5.53:10111,http://192.168.5.53:10112"
      ORDER_SPECS_SKIP_OCR_WARMUP: "1"
      VERIFICATION_SERVICE_ORIGIN: "http://master-turbo-podbor.ru"
      SUBMIT_HOUSEHOLD_GAS_URL: "http://master-turbo-podbor.ru/api/submit-household-gas-request"
      SUBMIT_SPU_APPLICATION_URL: "http://master-turbo-podbor.ru/api/submit-spu-application"
      SPU_CARD_API_URL: "http://master-turbo-podbor.ru/api/spu/card"
    ports:
      - "10112:8002"
    expose:
      - "8002"
    volumes:
      - chatbot-media:/app/back/chatbot/media
    networks:
      - master-podbora-network

  chatbot-web:
    build:
      context: .
      dockerfile: docker/Dockerfile.frontend
      args:
        PUBLIC_URL: /podbor-chat
        REACT_APP_API_URL: http://master-turbo-podbor.ru/podbor-api/api
        REACT_APP_1C_DATA_URL: http://master-turbo-podbor.ru/api/1c/data
        REACT_APP_SEARCH_EQUIPMENT_URL: http://master-turbo-podbor.ru/api/search-equipment
        REACT_APP_ESTIMATE_PRICE_URL: http://master-turbo-podbor.ru/api/estimate-price
        REACT_APP_TKP_ACCESSORIES_URL: http://master-turbo-podbor.ru/api/tkp-accessories
        REACT_APP_TKP_PDF_URL: http://master-turbo-podbor.ru/api/tkp-pdf
        REACT_APP_SUBMIT_HOUSEHOLD_GAS_URL: http://master-turbo-podbor.ru/api/submit-household-gas-request
        REACT_APP_SUBMIT_SPU_APPLICATION_URL: http://master-turbo-podbor.ru/api/submit-spu-application
        REACT_APP_GRAND_GAS_PRICE_URL: http://master-turbo-podbor.ru/api/prices/grand-gas-meters
    container_name: master-podbora-web
    restart: unless-stopped
    ports:
      - "10111:80"
    depends_on:
      - chatbot-backend
    networks:
      - master-podbora-network

networks:
  master-podbora-network:
    driver: bridge

volumes:
  chatbot-media:
