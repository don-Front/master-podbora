services:
  chatbot-backend:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
    container_name: master-podbora-backend
    restart: unless-stopped
    environment:
      DJANGO_DEBUG: "0"
      DJANGO_ALLOWED_HOSTS: "localhost,127.0.0.1,193.105.37.142,turbo-podbor.ru"
      DJANGO_CORS_ALLOWED_ORIGINS: "http://193.105.37.142:10111,http://193.105.37.142:10112"
      DJANGO_CSRF_TRUSTED_ORIGINS: "http://193.105.37.142:10111,http://193.105.37.142:10112"
      ORDER_SPECS_SKIP_OCR_WARMUP: "1"
      VERIFICATION_SERVICE_ORIGIN: "https://turbo-podbor.ru"
      SUBMIT_HOUSEHOLD_GAS_URL: "https://turbo-podbor.ru/api/submit-household-gas-request"
      SUBMIT_SPU_APPLICATION_URL: "https://turbo-podbor.ru/api/submit-spu-application"
      SPU_CARD_API_URL: "https://turbo-podbor.ru/api/spu/card"
    ports:
      - "10112:8002"
    expose:
      - "8002"
    volumes:
      - chatbot-media:/app/back/chatbot/media
    networks:
      - master-podbora-network

  chatbot-web:
    build:
      context: .
      dockerfile: docker/Dockerfile.frontend
      args:
        REACT_APP_API_URL: "http://193.105.37.142:10112/api"
        REACT_APP_1C_DATA_URL: "https://turbo-podbor.ru/api/1c/data"
        REACT_APP_SEARCH_EQUIPMENT_URL: "https://turbo-podbor.ru/api/search-equipment"
        REACT_APP_ESTIMATE_PRICE_URL: "https://turbo-podbor.ru/api/estimate-price"
        REACT_APP_TKP_ACCESSORIES_URL: "https://turbo-podbor.ru/api/tkp-accessories"
        REACT_APP_TKP_PDF_URL: "https://turbo-podbor.ru/api/tkp-pdf"
        REACT_APP_SUBMIT_HOUSEHOLD_GAS_URL: "https://turbo-podbor.ru/api/submit-household-gas-request"
        REACT_APP_GRAND_GAS_PRICE_URL: "https://turbo-podbor.ru/api/prices/grand-gas-meters"
    container_name: master-podbora-web
    restart: unless-stopped
    ports:
      - "10111:80"
    depends_on:
      - chatbot-backend
    networks:
      - master-podbora-network

networks:
  master-podbora-network:
    driver: bridge

volumes:
  chatbot-media:
